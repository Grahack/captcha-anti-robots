<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Communication</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    text-align:center;
    width:320px;
}

</style>
</head>
<body>

<div class="box">
    <h2>Communication importante</h2>

    <video width="320" height="240" controls preload="metadata">
    <source src="comm.mp4" type="video/mp4" />
    <track
      label="Choisir"
      kind="subtitles"
      srclang="st"
      src="comm-st.vtt"
      default />
    <track
      label="Robot"
      kind="subtitles"
      srclang="rbt"
      src="comm-rbt.vtt" />
    <track
      label="Français"
      kind="subtitles"
      srclang="fr"
      src="comm-fr.vtt" />
</video>

</div>
</body>
</html>
